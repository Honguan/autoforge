name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    name: core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (deep-learning pack tests skip without torch)
        run: pytest -q
  full:
    name: full (all packs, GUI in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch + every extra)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,deep,anthropic,onnx]"
          python -m playwright install --with-deps chromium
      - run: pytest -q
  package:
    name: wheel installs on a clean machine and quickstart works
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - name: Clean venv, no repo on the path
        run: |
          python -m venv /tmp/clean && cd /tmp
          /tmp/clean/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          time /tmp/clean/bin/autoforge quickstart
