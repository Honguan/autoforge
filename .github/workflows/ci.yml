name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch + every pack's dependencies)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,anthropic,hpo,onnx]" scikit-learn pandas transformers peft accelerate timm onnx onnxscript playwright
          python -m playwright install --with-deps chromium
      - name: Tests (core + every pack's smoke tests)
        run: pytest -q
