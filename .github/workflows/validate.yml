name: validate-index
on:
  push:
    branches: [packs-index]
  pull_request:
    branches: [packs-index]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "autoforge @ git+https://github.com/Honguan/autoforge@main"
      - run: autoforge index validate index.json
      - name: Install every pack at its pinned commit
        run: |
          export AUTOFORGE_INDEX_URL="$PWD/index.json"
          for name in $(python -c "import json;print(' '.join(p['name'] for p in json.load(open('index.json'))['packs']))"); do
            autoforge pack install "$name"
          done
