# Push a tag like v1.0.0 to release: PyPI (trusted publishing), GitHub Release, Docker images on GHCR.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: pip install build twine && python -m build && twine check dist/*
      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean && cd /tmp
          /tmp/clean/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/clean/bin/autoforge quickstart
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # configure a PyPI "trusted publisher" for this repo + workflow + environment
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create the release, or attach files if it was created in the GitHub UI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "AutoForge $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { flavor: cpu, file: Dockerfile }
          - { flavor: cuda, file: Dockerfile.cuda }
    steps:
      - name: Free disk space for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image names
        id: tags
        run: |
          repo=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/autoforge
          echo "tags=$repo:${{ matrix.flavor }},$repo:${GITHUB_REF_NAME#v}-${{ matrix.flavor }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
