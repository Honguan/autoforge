id: global_lag_gbm
name: One shared model for many series (lag features + gradient boosting)
task_types: [timeseries-forecast]
entrypoint: trainers/forecast.py:train_global
predictor: trainers/forecast.py
requires: { device: cpu, min_ram_gb: 2 }
good_for: Many related series in one CSV (sales per store/product, load per meter); short series borrow patterns from long ones.
avoid_when: A single series (use lag_gbm), or series with unrelated behaviour that should not share a model.
defaults: { series_column: series_id, time_column: date, lags: 14, windows: [3, 7], test_fraction: 0.2,
            learning_rate: 0.05, max_iter: 300, max_leaf_nodes: 31 }
search_space:
  lags: { type: int, low: 7, high: 60 }
  learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
  max_leaf_nodes: { type: int, low: 8, high: 64 }
