id: contrastive_pairs
name: Contrastive fine-tuning with in-batch negatives (MultipleNegativesRanking)
task_types: [text-embedding]
entrypoint: trainers/contrastive.py:train
predictor: trainers/contrastive.py
exporters:
  onnx: trainers/contrastive.py:export_onnx
requires: { device: any, min_ram_gb: 4 }
good_for: Domain search / RAG retrieval / FAQ matching from 500+ (query, relevant passage) pairs; MiniLM trains on CPU in minutes, larger encoders want a GPU.
avoid_when: You have class labels rather than pairs (use text-classification), or fewer than ~200 pairs (use the base model as is).
defaults: { model_name: sentence-transformers/all-MiniLM-L6-v2, epochs: 3, batch_size: 32, learning_rate: 0.00002,
            warmup_ratio: 0.1, max_length: 128, temperature: 0.05, val_fraction: 0.1, pooling: mean }
search_space:
  learning_rate: { type: float, low: 0.000005, high: 0.0001, log: true }
  epochs: { type: int, low: 1, high: 5 }
  temperature: { type: float, low: 0.02, high: 0.1, log: true }
  batch_size: { choices: [16, 32, 64] }
