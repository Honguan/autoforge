id: torchvision_detector
name: Fine-tune a torchvision Faster R-CNN
task_types: [object-detection]
entrypoint: trainers/detector.py:train
predictor: trainers/detector.py
requires: { device: any, min_ram_gb: 4 }
good_for: Locating and counting objects (products on shelves, defects, vehicles, animals) with boxes; 100+ labelled boxes per class; COCO-pretrained so small datasets work; GPU recommended, the mobilenet model runs on CPU.
avoid_when: One label per whole image is enough (image-classification) or you need exact pixel outlines (image-segmentation).
defaults: { model_name: fasterrcnn_mobilenet_v3_large_fpn, pretrained: true, epochs: 10, batch_size: 4,
            learning_rate: 0.005, weight_decay: 0.0005, min_size: 512, max_size: 853,
            score_threshold: 0.5, val_fraction: 0.2, hflip: true }
search_space:
  learning_rate: { type: float, low: 0.001, high: 0.02, log: true }
  epochs: { type: int, low: 5, high: 30 }
  min_size: { choices: [384, 512, 640, 800] }
  model_name: { choices: [fasterrcnn_mobilenet_v3_large_fpn, fasterrcnn_resnet50_fpn_v2] }
