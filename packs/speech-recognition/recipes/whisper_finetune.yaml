id: whisper_finetune
name: Fine-tune Whisper (encoder-decoder speech-to-text)
task_types: [speech-to-text]
entrypoint: trainers/whisper_train.py:train
predictor: trainers/whisper_train.py
requires: { device: any, min_ram_gb: 8 }
good_for: Improve transcription of accented speech, jargon, product names or a lower-resource language from 1+ hour of clips (<= 30 s) with exact transcripts; GPU strongly recommended (whisper-small needs ~8 GB VRAM), CPU only for whisper-tiny/base.
avoid_when: Audio is long unsegmented recordings without aligned text, you need speaker labels (diarization) or word timestamps, or the base Whisper is already accurate (check baseline_wer first).
defaults: { model_name: openai/whisper-small, language: null, task: transcribe, freeze_encoder: false, epochs: 3,
            batch_size: 8, grad_accum: 2, learning_rate: 0.00001, max_label_length: 225, val_fraction: 0.1,
            num_beams: 1 }
search_space:
  learning_rate: { type: float, low: 0.000003, high: 0.00005, log: true }
  epochs: { type: int, low: 2, high: 6 }
  freeze_encoder: { choices: [false, true] }
