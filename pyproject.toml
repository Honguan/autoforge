[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoforge"
version = "0.6.0"
description = "Let AI analyze, plan, train, evaluate and deploy AI models on your own hardware."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "mcp>=2.3,<3",
    "httpx2>=2.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.3", "nvidia-ml-py>=12.0"]
anthropic = ["anthropic>=1.14,<2"]
hpo = ["optuna>=5.0,<6"]
dev = ["pytest>=8.0", "optuna>=5.0,<6"]

[project.scripts]
autoforge = "autoforge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["autoforge"]

[tool.pytest.ini_options]
testpaths = ["tests", "packs"]
norecursedirs = ["fixtures"]
